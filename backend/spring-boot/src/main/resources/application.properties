spring.application.name=security-awareness-hub

# Credenciales fuera del codigo (Sesion 7).
# Spring las toma de variables de entorno o, si no existen, del archivo
# local .env (copia de .env.example). El archivo .env no se sube a Git.
spring.config.import=optional:file:.env[.properties]

# Conexion a MariaDB con un usuario propio, no root
# (database/crear_usuario_app.sql)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/security_awareness_hub}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de JPA e Hibernate.
# validate: Hibernate compara las entidades con las tablas y no las
# modifica (ver docs/migracion-decisiones.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# API REST: Vaadin no debe atender /api/** (asi una ruta inexistente
# de la API responde 404 en JSON y no la pagina HTML de Vaadin)
vaadin.exclude-urls=/api/**

# Registro: INFO evita escribir en el log detalles de autenticacion
logging.level.org.springframework.security=INFO

# Datos iniciales (Sesion 6): administrador que se crea al arrancar si no hay
# ninguno activo (equivale a crear_admin.php). Valores solo en .env.
sah.admin.correo=${ADMIN_CORREO:}
sah.admin.password=${ADMIN_PASSWORD:}

# Carga masiva por CSV (Sesion 8)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Agrupar sentencias SQL al guardar por bloques
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Envio de correos (Sesion 8). Todo llega por variables de entorno o .env.
# Con MAIL_ENABLED=false no se envia nada (solo se registra en el log).
sah.correo.habilitado=${MAIL_ENABLED:false}
sah.correo.remitente=${MAIL_FROM:no-reply@sah.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
